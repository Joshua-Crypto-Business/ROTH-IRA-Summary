// MA cache: { TICKER: { ma50, ma100, ma200 } }
let maCache1 = {};
let maCache2 = {};

async function fetchMA(ticker, period) {
  try {
    const now = Math.floor(Date.now() / 1000);
    const from = now - (period + 60) * 24 * 60 * 60;
    const url = `${INDICATOR_BASE}?symbol=${ticker}&resolution=D&from=${from}&to=${now}&indicator=sma&timeperiod=${period}&token=${FINNHUB_KEY}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const d = await r.json();
    if (d && d.sma && d.sma.length > 0) {
      const val = d.sma[d.sma.length - 1];
      return isNaN(val) ? null : val;
    }
    return null;
  } catch(e) { return null; }
}

async function fetchAllMAs(positions, cache) {
  for (let i = 0; i < positions.length; i++) {
    const t = positions[i].ticker;
    const [ma50, ma100, ma200] = await Promise.all([
      fetchMA(t, 50),
      fetchMA(t, 100),
      fetchMA(t, 200),
    ]);
    cache[t] = { ma50, ma100, ma200 };
    await new Promise(r => setTimeout(r, 300));
  }
}

async function saveMAs(key, cache) {
  try { if (window.storage) await window.storage.set(key, JSON.stringify(cache)); } catch(e) {}
  try { localStorage.setItem(key, JSON.stringify(cache)); } catch(e) {}
}

async function loadMAs(key) {
  try {
    if (window.storage) {
      const r = await window.storage.get(key);
      if (r && r.value) return JSON.parse(r.value);
    }
  } catch(e) {}
  try {
    const ls = localStorage.getItem(key);
    if (ls) return JSON.parse(ls);
  } catch(e) {}
  return {};
}

function fmtMA(label, val, price) {
  if (!val) return `<span style="color:#555">${label}: —</span>`;
  const above = price && price > val;
  const arrow = above ? '▲' : '▼';
  const color = above ? '#21ce99' : '#ff5000';
  return `<span style="color:#B3A000;font-weight:600">${label}</span> <span style="color:#B3A000">${arrow} $${val.toFixed(2)}</span>`;
}

// Storage helpers
async function save(key, data) {
  const payload = { pos: data, ts: Date.now() };
  try { if (window.storage) await window.storage.set(key, JSON.stringify(payload)); } catch(e) {}
  try { localStorage.setItem(key, JSON.stringify(payload)); } catch(e) {}
}

async function load(key, fallback) {
  try {
    if (window.storage) {
      const r = await window.storage.get(key);
      if (r && r.value) { const d = JSON.parse(r.value); if (d.pos) return d.pos; }
    }
  } catch(e) {}
  try {
    const ls = localStorage.getItem(key);
    if (ls) { const d = JSON.parse(ls); if (d.pos) return d.pos; }
  } catch(e) {}
  return fallback;
}

// Fetch single price
async function fetchPrice(ticker) {
  try {
    const r = await fetch(`${BASE}?symbol=${ticker}&token=${FINNHUB_KEY}`);
    if (!r.ok) return null;
    const d = await r.json();
    return d.c || null;
  } catch(e) { return null; }
}

// Fetch all IRA1
async function fetchAll() {
  const btn = document.getElementById('refresh-btn1');
  if (btn) { btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; }
  try {
    for (let i = 0; i < positions1.length; i++) {
      const p = await fetchPrice(positions1[i].ticker);
      if (p !== null) positions1[i].price = p;
      if (i < positions1.length - 1) await new Promise(r => setTimeout(r, 120));
    }
    await save(STORAGE_KEY1, positions1);
    await fetchAllMAs(positions1, maCache1);
    await saveMAs(MA_KEY1, maCache1);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('last-updated').textContent = 'IRA 1 refresh failed — check network';
  } finally {
    renderAll();
    if (btn) { btn.style.opacity = ''; btn.style.pointerEvents = ''; }
  }
}

function fmt(n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function renderTable(positions, tbodyId, editFn, maCache) {
  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '';
  let totalVal = 0, totalBasis = 0;

  positions.forEach((p, i) => {
    const price = p.price;
    const val = price ? price * p.shares : null;
    const basis = p.cost * p.shares;
    const pnlAmt = val !== null ? val - basis : null;
    const pnlPct = pnlAmt !== null ? (pnlAmt / basis) * 100 : null;
    if (val) totalVal += val;
    totalBasis += basis;

    const mas = (maCache && maCache[p.ticker]) || {};
    const maLine = [
      fmtMA('50d', mas.ma50, price),
      fmtMA('100d', mas.ma100, price),
      fmtMA('200d', mas.ma200, price),
    ].join(' &nbsp;·&nbsp; ');

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="ticker">${p.ticker}</div>
        <div class="shares-cost">${p.shares.toFixed(4)} sh · $${p.cost.toFixed(2)} avg</div>
        <div class="ma-line">${maLine}</div>
      </td>
      <td class="td-right">
        <div class="price-val" id="${tbodyId}-price-${p.ticker}">
          ${price ? fmt(price) : '<span class="loading-dot">—</span>'}
        </div>
      </td>
      <td class="td-right">
        <div class="value-val">${val ? fmt(val) : '—'}</div>
      </td>
      <td class="td-right">
        ${pnlAmt !== null
          ? `<div class="${pnlAmt >= 0 ? 'pnl-pos' : 'pnl-neg'}">${pnlAmt >= 0 ? '+' : ''}${fmt(Math.abs(pnlAmt))}</div>
             <div class="pnl-pct ${pnlAmt >= 0 ? 'pnl-pos' : 'pnl-neg'}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(1)}%</div>`
          : '<span class="neutral">—</span>'}
      </td>
      <td class="td-right">
        <button class="edit-btn" onclick="${editFn}(${i})" title="Edit price">✏️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  return { totalVal, totalBasis };
}

function renderAll() {
  // IRA1
  const r1 = renderTable(positions1, 'holdings-body', 'editPrice1', maCache1);
  const ira1Val = r1.totalVal, ira1Basis = r1.totalBasis;
  document.getElementById('ira1-total').textContent = ira1Val ? fmt(ira1Val) : '—';
  document.getElementById('ira1-cash').textContent = 'Cash: $0.00';
  const p1pnl = ira1Val - ira1Basis;
  const p1pct = (p1pnl / ira1Basis) * 100;
  const ira1El = document.getElementById('ira1-pnl');
  if (ira1Val) {
    ira1El.textContent = `vs basis ${p1pnl >= 0 ? '+' : ''}${fmt(Math.abs(p1pnl))} (${p1pct >= 0 ? '+' : ''}${p1pct.toFixed(1)}%)`;
    ira1El.className = 'account-pnl ' + (p1pnl >= 0 ? 'up' : 'dn');
  }

  // IRA2
  const r2 = renderTable(positions2, 'holdings-body2', 'editPrice2', maCache2);
  const ira2Val = r2.totalVal + IRA2_CASH, ira2Basis = r2.totalBasis;
  document.getElementById('ira2-total').textContent = ira2Val ? fmt(ira2Val) : '—';
  document.getElementById('ira2-cash').textContent = `Cash: ${fmt(IRA2_CASH)}`;
  const p2pnl = ira2Val - ira2Basis - IRA2_CASH;
  const p2pct = ira2Basis > 0 ? (p2pnl / ira2Basis) * 100 : 0;
  const ira2El = document.getElementById('ira2-pnl');
  if (r2.totalVal) {
    ira2El.textContent = `vs basis ${p2pnl >= 0 ? '+' : ''}${fmt(Math.abs(p2pnl))} (${p2pct >= 0 ? '+' : ''}${p2pct.toFixed(1)}%) · Cash ${fmt(IRA2_CASH)}`;
    ira2El.className = 'account-pnl ' + (p2pnl >= 0 ? 'up' : 'dn');
  }

  // Aggregate
  const combinedVal = (ira1Val || 0) + (ira2Val || 0);
  const combinedBasis = IRA1_COST_BASIS + ira2Basis + IRA2_CASH;
  const aggPnl = combinedVal - combinedBasis;
  const aggPct = (aggPnl / combinedBasis) * 100;
  document.getElementById('agg-total').textContent = combinedVal ? fmt(combinedVal) : '—';
  document.getElementById('agg-basis').textContent = `Basis: ${fmt(combinedBasis)}`;
  const aggEl = document.getElementById('agg-pnl');
  if (combinedVal) {
    aggEl.textContent = `P&L: ${aggPnl >= 0 ? '+' : ''}${fmt(Math.abs(aggPnl))} (${aggPct >= 0 ? '+' : ''}${aggPct.toFixed(1)}%)`;
    aggEl.className = aggPnl >= 0 ? 'up' : 'dn';
  }

  drawPie('pie1', 'pie1-legend', positions1);
  drawPie('pie2', 'pie2-legend', positions2);
}

// Inline edit IRA1
function editPrice1(i) {
  const el = document.getElementById('holdings-body-price-' + positions1[i].ticker);
  if (!el) return;
  const cur = positions1[i].price || '';
  el.innerHTML = `<input class="price-input" id="ei1-${i}" type="number" value="${cur}" step="0.01">`;
  const input = document.getElementById('ei1-' + i);
  input.focus(); input.select();
  input.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const v = parseFloat(input.value);
      if (!isNaN(v) && v > 0) { positions1[i].price = v; await save(STORAGE_KEY1, positions1); renderAll(); }
    }
    if (e.key === 'Escape') renderAll();
  });
}

// Sector-grouped pie chart
function drawPie(canvasId, legendId, positions) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 12;

  // Group by sector
  const sectorMap = {};
  positions.forEach(p => {
    const sector = SECTORS[p.ticker] || 'Other';
    const val = (p.price || p.cost) * p.shares;
    if (!sectorMap[sector]) sectorMap[sector] = { val: 0, tickers: [] };
    sectorMap[sector].val += val;
    sectorMap[sector].tickers.push(p.ticker);
  });

  const sectors = Object.keys(sectorMap);
  const total = sectors.reduce((s, k) => s + sectorMap[k].val, 0);

  let start = -Math.PI / 2;
  sectors.forEach(sector => {
    const slice = (sectorMap[sector].val / total) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + slice);
    ctx.fillStyle = SECTOR_COLORS[sector] || '#888';
    ctx.fill();
    start += slice;
  });

  // Center hole
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.48, 0, 2 * Math.PI);
  ctx.fillStyle = '#111';
  ctx.fill();

  // Legend — sector + tickers + %
  const legend = document.getElementById(legendId);
  legend.innerHTML = '';
  sectors.forEach(sector => {
    const pct = ((sectorMap[sector].val / total) * 100).toFixed(1);
    const color = SECTOR_COLORS[sector] || '#888';
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.cssText = 'width:100%; justify-content:flex-start; gap:6px; margin-bottom:3px;';
    item.innerHTML = `
      <div class="legend-dot" style="background:${color}; flex-shrink:0;"></div>
      <span style="color:#ccc; font-size:11px; font-weight:500;">${sector}</span>
      <span style="color:#666; font-size:10px;">${sectorMap[sector].tickers.join(', ')}</span>
      <span style="color:${color}; font-size:11px; margin-left:auto;">${pct}%</span>
    `;
    legend.appendChild(item);
  });
}
